name: Utils image

# Builds utils/Dockerfile and publishes it to ghcr.io as
# bakatrouble/bakajiten-utils (consumed by the bakajiten-data pack
# workflow). Layer + cargo caches persist across runs via the GHA
# cache backend, so rebuilds only recompile what changed.
on:
  push:
    branches: ['**']
    paths:
      - 'utils/**'
      - 'lib/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/bakatrouble/bakajiten-utils

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Docker Buildx.
        uses: docker/setup-buildx-action@v4

      - name: Login ghcr.
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: utils/Dockerfile
          tags: ${{ env.IMAGE }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
