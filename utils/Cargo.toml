[package]
name = "utils"
version = "0.1.0"
edition = "2021"
description = "Tool binaries (model packing, data fetching, parser smoke tests, recognizer test UI)"
license = "MIT"

[[bin]]
name = "pack-data"
path = "src/bin/pack-data/main.rs"

[[bin]]
name = "fetch-data"
path = "src/bin/fetch-data/main.rs"

[dependencies]
librecognizer.workspace = true
libdict.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
csv = "1.4"
postcard = { version = "1.1.3", features = ["alloc"] }
quick-xml.workspace = true
ureq.workspace = true
flate2.workspace = true
indicatif.workspace = true
thiserror.workspace = true
encoding_rs.workspace = true
zip.workspace = true
