[package]
name = "libdict"
version = "0.1.0"
edition = "2024"

[lib]
name = "dict"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
serde.workspace = true
rkyv.workspace = true
thiserror.workspace = true
unicode-normalization = "0.1.25"
unic = "0.9.0"
uniffi.workspace = true
postcard = { version = "1.1.3", features = ["alloc"] }

# File mappings for path-based loading (native only: WASM has no
# mmap syscalls, so the WASM build keeps caller-provided bytes).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2.workspace = true

[dev-dependencies]
memmap2 = "0.9"
