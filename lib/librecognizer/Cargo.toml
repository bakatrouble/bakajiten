[package]
name = "librecognizer"
version = "0.1.0"
edition = "2021"
description = "Handwriting recognition: tegaki's pure-Rust engine (preprocessing, Bezier features, BiLSTM, CTC beam search) plus one-time TFLite+recospec conversion"
license = "MIT"

[lib]
name = "recognizer"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
ndarray = "0.16"
safetensors = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
uniffi.workspace = true

[dev-dependencies]
serde_json = { workspace = true }
